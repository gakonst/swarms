name = "pnp"
defaultTargets = ["Pnp"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "Pnp"
globs = ["Pnp.+"]

[[lean_exe]]
name = "check"
root = "Check"
supportInterpreter = true
